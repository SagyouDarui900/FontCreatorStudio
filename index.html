    <!-- FOUC Prevention Theme Script (Applied synchronously before first paint) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('font_editor_theme_mode') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark' || t === 'nord') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
